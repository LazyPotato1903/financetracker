<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Finance Tracker</title>
<meta name="description" content="A private, offline personal finance tracker that runs SQLite in your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232e7d6b'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial'>%E2%82%B1</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">₱</span> Finance</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="db-status" id="dbStatus">Loading…</div>
        <div class="ver" id="verLabel"></div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div id="crumb" class="crumb">Dashboard</div>
        <div class="actions">
          <input id="importFile" type="file" accept=".db,.sqlite,.sqlite3" hidden />
          <button class="btn ghost" id="btnImport" title="Load a finance.db file">⤓ Import .db</button>
          <button class="btn ghost" id="btnExport" title="Download your data as finance.db">⤒ Export .db</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- Modal host -->
  <div id="modalHost"></div>

  <!-- Toast host -->
  <div id="toast" class="toast" hidden></div>

  <!-- Libraries (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
